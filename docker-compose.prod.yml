# Production stack for a single VPS. Usage (see deploy/README.md):
#   cp .env.production.example .env   # then fill in the values
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Only Caddy publishes ports (80/443). Postgres, Redis and MinIO stay on the
# internal network; MinIO is reachable from outside solely through Caddy at
# https://s3.<DOMAIN>.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sma
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: sma
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sma"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: creates the media bucket if it doesn't exist yet.
  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET:-sma-media}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing "local/$$S3_BUCKET" &&
        echo "bucket $$S3_BUCKET ready"
    restart: "no"

  # One-shot: applies pending migrations and seeds the workspace/brand
  # profile (seed is idempotent). web/worker wait for this to finish.
  migrate:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: deps
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://sma:${POSTGRES_PASSWORD}@postgres:5432/sma
    working_dir: /app/packages/db
    command: ["sh", "-c", "pnpm migrate && pnpm seed"]
    restart: "no"

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: web
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    env_file: .env
    environment:
      DATABASE_URL: postgresql://sma:${POSTGRES_PASSWORD}@postgres:5432/sma
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: https://s3.${DOMAIN:?set DOMAIN in .env}
      S3_FORCE_PATH_STYLE: "true"
      NODE_ENV: production
    expose:
      - "3000"

  worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: worker
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    env_file: .env
    environment:
      DATABASE_URL: postgresql://sma:${POSTGRES_PASSWORD}@postgres:5432/sma
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: https://s3.${DOMAIN}
      S3_FORCE_PATH_STYLE: "true"
      NODE_ENV: production
    # Chrome (Remotion) uses /dev/shm heavily; the 64 MB Docker default
    # makes renders crash with "page crashed".
    shm_size: 1gb

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
      - minio
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:?set BASIC_AUTH_USER in .env}
      BASIC_AUTH_HASH: ${BASIC_AUTH_HASH:?set BASIC_AUTH_HASH in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgres-data:
  redis-data:
  minio-data:
  caddy-data:
  caddy-config:
